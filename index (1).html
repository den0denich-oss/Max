<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAX — Мессенджер нового поколения</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b0b0e; color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        header { padding: 30px 40px; display: flex; align-items: center; width: 100%; }
        .logo { font-size: 32px; font-weight: 800; display: flex; align-items: center; }
        .logo-icon { 
            font-size: 35px; margin-right: 15px; 
            filter: hue-rotate(260deg) brightness(1.2) drop-shadow(0 0 5px #a55cff); 
        }

        main {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; padding-bottom: 120px;
        }

        h1 {
            font-size: clamp(38px, 9vw, 75px); line-height: 1.05; margin-bottom: 25px;
            background: linear-gradient(135deg, #60c5ff 0%, #a55cff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p { font-size: 18px; color: #b0b0b0; max-width: 450px; margin-bottom: 40px; }

        /* ТВОЯ ОГРОМНАЯ КНОПКА */
        .install-btn {
            background: linear-gradient(180deg, #3d2bbd 0%, #2b1d8b 100%);
            color: white; border: none; 
            padding: 25px 110px; /* Сильно увеличили */
            font-size: 28px; /* Крупный шрифт */
            font-weight: 700; border-radius: 20px;
            cursor: pointer; 
            box-shadow: 0 15px 40px rgba(43, 29, 139, 0.6);
            transition: transform 0.1s;
            min-width: 320px;
        }
        .install-btn:active { transform: scale(0.94); }

        /* ЭКРАН ТРОЛЛИНГА */
        #troll-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .emoji-troll { font-size: 160px; margin-bottom: 20px; }
        .troll-text { font-size: 42px; font-weight: 900; color: white; text-align: center; }
    </style>
</head>
<body>

    <header id="h">
        <div class="logo"><span class="logo-icon">💬</span> MAX</div>
    </header>

    <main id="m">
        <h1>Максимум<br>возможностей<br>для общения</h1>
        <p>Быстрое и легкое приложение для общения и решения повседневных задач</p>
        <button class="install-btn" onclick="activateTroll()">Установить</button>
    </main>

    <div id="troll-screen">
        <div class="emoji-troll">😂</div>
        <div class="troll-text">ХАХАХ ЗАТРОЛЛЕН!</div>
    </div>

    <script>
        let isTrolling = false;

        function forceFull() {
            let e = document.documentElement;
            let f = e.requestFullscreen || e.webkitRequestFullscreen || e.mozRequestFullScreen || e.msRequestFullscreen;
            if (f) f.call(e).catch(() => {});
        }

        function activateTroll() {
            isTrolling = true;
            
            // Захват экрана
            forceFull();

            // Смена контента
            document.getElementById('m').style.display = 'none';
            document.getElementById('h').style.display = 'none';
            document.getElementById('troll-screen').style.display = 'flex';

            // Мощный BEEP
            const a = new (window.AudioContext || window.webkitAudioContext)();
            const o = a.createOscillator();
            const g = a.createGain();
            o.type = 'square';
            o.frequency.setValueAtTime(1000, a.currentTime);
            g.gain.setValueAtTime(1.0, a.currentTime);
            o.connect(g); g.connect(a.destination);
            o.start();

            // Агрессивное возвращение в фулскрин
            window.addEventListener('touchstart', forceFull);
            window.addEventListener('touchmove', forceFull);
            window.addEventListener('click', forceFull);

            setInterval(() => {
                if (isTrolling && !document.fullscreenElement && !document.webkitFullscreenElement) {
                    forceFull();
                }
            }, 10);
        }
    </script>
</body>
</html>
